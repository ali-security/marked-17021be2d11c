name: "Tests"
on:
  workflow_dispatch:
    inputs:
      test-filter:
        description: Test selector passed to the test runners
        required: false
        default: ''

jobs:
  Test:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    strategy:
      matrix:
        node_version: [14, 8]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Node
        uses: dcodeIO/setup-node-nvm@master
        with:
          node-version: ${{ matrix.node_version }}
      - name: Install Dependencies
        run: npm ci
      - name: Install Node 8-compatible Jasmine
        if: matrix.node_version == 8
        run: npm install --no-save --ignore-scripts jasmine@3.6.0
      - name: Run Node 8 compatibility tests on Node 14
        if: matrix.node_version == 8
        run: |
          export NVM_DIR="/home/runner/mynvm"
          . "$NVM_DIR/nvm.sh"
          nvm install 14
          NODE14=$(nvm which 14)
          NODE14_BIN=$(dirname "$NODE14")
          echo "PATH=$NODE14_BIN:$PATH" >> "$GITHUB_ENV"
          echo "NVM_BIN=$NODE14_BIN" >> "$GITHUB_ENV"
      - name: Run Unit Tests 👩🏽‍💻
        run: |
          if [ "${{ matrix.node_version }}" = "8" ]; then
            export NVM_DIR="/home/runner/mynvm"
            . "$NVM_DIR/nvm.sh"
            nvm use 14
          fi
          npm run test:unit -- ${{ inputs.test-filter }}
      - name: Run Spec Tests 👩🏽‍💻
        run: |
          if [ "${{ matrix.node_version }}" = "8" ]; then
            export NVM_DIR="/home/runner/mynvm"
            . "$NVM_DIR/nvm.sh"
            nvm use 14
          fi
          npm run test:specs -- ${{ inputs.test-filter }}
      - name: Build and Pack
        if: matrix.node_version == 14
        run: |
          npm run build
          npm pack
      - name: Upload Package
        if: matrix.node_version == 14
        uses: actions/upload-artifact@v4
        with:
          name: marked-2.0.6
          path: marked-2.0.6.tgz
          if-no-files-found: error

  Lint:
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout Code
        uses: actions/checkout@v2
      - name: Install Dependencies
        run: npm ci
      - name: Lint ✨
        run: npm run test:lint

  Skip:
    if: contains(github.event.head_commit.message, '[skip ci]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Skip CI 🚫
        run: echo skip ci
